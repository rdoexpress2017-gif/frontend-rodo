server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip para carregamento rápido em dispositivos móveis (3G/4G/5G)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy reverso opcional para chamadas relativas /api/v1 dentro do cluster K3s
    location /api/ {
        proxy_pass http://backend-rodo-service.rodo-express.svc.cluster.local:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router SPA Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
